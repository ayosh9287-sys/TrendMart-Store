<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendMart | Your Shopping Cart</title>
    <script src="js/auth-check.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body style="background-color: #fbfbfe;">

    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: #4338ca;"><i class="fa fa-shopping-bag"></i> TrendMart</a>
        </div>
<nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="women.html">Women</a>
    <a href="men.html">Men</a>
    <a href="sunglasses.html">Sunglasses</a>
    <a href="perfumes.html">Perfumes</a>
    <a href="accessories.html">Accessories</a>
    <a href="bags.html">Bags</a>
</nav>

        <div class="auth-buttons">
            <a href="index.html" class="btn-login"><i class="fa fa-arrow-left"></i> Continue Shopping</a>
        </div>
    </header>

    <main class="products-page-container" style="max-width: 800px; margin: 0 auto;">
        <div class="page-title">
            <h2>Your Shopping Cart</h2>
            <p>Review your selected items before checkout.</p>
        </div>

        <div id="cartItemsContainer">
        </div>

        <div id="cartSummaryBox" class="product-card" style="padding: 25px; margin-top: 30px; display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: #1e1b4b; font-size: 1.3rem;">Total Price:</h3>
                <span id="totalPriceDisplay" style="font-size: 1.6rem; color: #6366f1; font-weight: 700;">$0.00</span>
            </div>
            <div style="display: flex; gap: 15px;">
                <button type="button" id="btnClearCart" class="btn-login" style="flex: 1; padding: 12px; border-color: #ef4444; color: #ef4444;">Clear Cart</button>
                <button type="button" class="btn-add-cart" style="flex: 2; padding: 12px; justify-content: center; font-size: 1rem;">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <script src="java/cart.js"></script>
</body>
</html>
