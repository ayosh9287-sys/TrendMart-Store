<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendMart | Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body style="background: linear-gradient(135deg, #f5f3ff 0%, #e0e7ff 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;">

    <div class="blocker-box" style="width: 100%; max-width: 400px; text-align: left; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <h2 style="color: #4338ca; margin-bottom: 5px;"><i class="fa-solid fa-bag-shopping"></i> TrendMart</h2>
        <p style="margin-bottom: 20px; font-size: 0.9rem; color: #6b7280;">Create your account to start shopping.</p>
        
        <div class="signup-container">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; color: #4b5563;">First Name</label>
                <input type="text" id="signName" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; color: #4b5563;">Email Address</label>
                <input type="email" id="signEmail" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; color: #4b5563;">Password</label>
                <input type="password" id="signPassword" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;">
            </div>
            
            <button type="button" id="sendBtn" class="btn-signup" style="width: 100%; padding: 12px; border-radius: 6px; font-size: 1rem; border: none; background-color: #6366f1; color: white; font-weight: 600; cursor: pointer;">
                Register
            </button>
        </div>

        <p style="margin-top: 20px; font-size: 0.85rem; text-align: center; color: #6b7280;">
            Already have an account? <a href="log.html" style="color: #6366f1; font-weight: 600; text-decoration: none;">Login here</a>
        </p>
    </div>

    <script src="java/sign.js"></script>
</body>
</html>
